name: Generate profile assets

on:
  schedule:
    - cron: "30 21 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Generate SVG assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/generate_profile.py

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "chore: refresh profile SVG assets"
          git push
