name: Generate profile assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate SVG assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/generate_profile.py

      - name: Commit generated assets
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: refresh profile SVG assets"
          default_author: github_actions
